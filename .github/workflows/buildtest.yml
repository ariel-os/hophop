name: Build

on:
  pull_request:

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      morethandocs: ${{ steps.filter.outputs.morethandocs }}

    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            morethandocs:
              - '!doc/**'
              - '!**/README.md'

  build:
    runs-on: ubuntu-24.04
    # This is not 100% sharp because it means that commits can slip by SPDX if
    # they only touch the docs, but that'll be caught soon enough. (We could be
    # granular if we did every single tests/ as a step).
    if: needs.detect.outputs.morethandocs == 'true'
    needs: detect
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2

      - name: Install stable toolchain (rest will be pulled by laze target)
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy, llvm-tools

      - name: Add nightly Rust for nrfxlib-sys-pretty
        run: |
          rustup toolchain add nightly
          rustup +nightly component add rustfmt
          rustup +nightly component add llvm-tools

      - name: Install laze and other tools
        uses: taiki-e/install-action@v2
        with:
          tool: laze@0.1,cargo-doc2readme,cargo-vet

      - name: "Installing Ariel OS prerequisites through apt (plus pipx for reuse.software)"
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: ninja-build gcc-arm-none-eabi pipx
          version: 20261106
          # "fatal error: stdio.h: No such file or directory" arises otherwise;
          # presumably, compiler paths are set up in post-install scripts.
          execute_install_scripts: true

      - name: "Install Ariel OS prerequisites through laze"
        run: |
          # For unknown reasons this only works in the main repo; a trial run
          # ensures that the right repo is alredy checked out
          laze build install-toolchain || true
          laze build -C build/imports/ariel-os/ install-toolchain

      - name: "Checking whether tests list change since GitHub workflows were enumerated"
        run: |
          ls test/ | sha256sum -c <(echo '4049d44c0973d4f532c79cdf01d5cd60076eb0d449ba217f06ff251ea4b14778  -')
      # Regenerate this whenever tests/ changes through
      # :r!ls ./test/[0-9]*.sh | sed 's/.*/      - run: & || echo & >> FAILED\n        name: &/'
      - run: ./test/01_reuse.sh || echo ./test/01_reuse.sh >> FAILED
        name: ./test/01_reuse.sh
      - run: ./test/02_vet.sh || echo ./test/02_vet.sh >> FAILED
        name: ./test/02_vet.sh
      - run: ./test/03_check.sh || echo ./test/03_check.sh >> FAILED
        name: ./test/03_check.sh
      - run: ./test/04_fmt.sh || echo ./test/04_fmt.sh >> FAILED
        name: ./test/04_fmt.sh
      - run: ./test/05_cargotest.sh || echo ./test/05_cargotest.sh >> FAILED
        name: ./test/05_cargotest.sh
      - run: ./test/06_doc2readme.sh || echo ./test/06_doc2readme.sh >> FAILED
        name: ./test/06_doc2readme.sh
      - run: ./test/07_app-build.sh || echo ./test/07_app-build.sh >> FAILED
        name: ./test/07_app-build.sh
      - run: ./test/08_pretty-rebuild.sh || echo ./test/08_pretty-rebuild.sh >> FAILED
        name: ./test/08_pretty-rebuild.sh
      - run: ./test/99_cargolock.sh || echo ./test/99_cargolock.sh >> FAILED
        name: ./test/99_cargolock.sh
      # End genreated

      - name: Summary of failed steps
        run: "! grep '' FAILED"

  check-links:
    # TBD: Make this GitHub-independent and put into test.sh
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: tcort/github-action-markdown-link-check@v1
      with:
        # Ignoring several URIs because the hosts don't react sensibly when
        # detecting a bot request, and maybe the bot should also just do HEAD.
        config-file: .github/mlc_config.json
