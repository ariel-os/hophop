name: Build

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2

      - name: Install stable toolchain (rest will be pulled by laze target)
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy, llvm-tools

      - name: Install laze and other tools
        uses: taiki-e/install-action@v2
        with:
          tool: laze@0.1,cargo-doc2readme,cargo-vet

      - name: "Installing Ariel OS prerequisites through apt (plus pipx for reuse.software)"
        run: sudo apt-get install ninja-build gcc-arm-none-eabi pipx

      - name: "Install Ariel OS prerequisites through laze"
        run: |
          # For unknown reasons this only works in the main repo; a trial run
          # ensures that the right repo is alredy checked out
          laze build -C examples/ install-toolchain || true
          laze build -C examples/build/imports/ariel-os/ install-toolchain

      - run: |
          ./test.sh

  check-links:
    # TBD: Make this GitHub-independent and put into test.sh
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: tcort/github-action-markdown-link-check@v1
