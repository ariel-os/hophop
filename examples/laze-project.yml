imports:
  - git:
      url: https://github.com/chrysn-pull-requests/ariel-os
      #commit: for-hophop-20260225 (which is https://github.com/ariel-os/ariel-os/pull/1819 plus https://github.com/ariel-os/ariel-os/pull/1613)
      commit: b6815311c6578f3de21482eae57d5e870f88d85f
    dldir: ariel-os

apps:
  - name: hophop-examples
    selects:
      - nrf91-modem
      - nrf-radiocore-firmware-dect
      # Actually only for the tx and coap example
      - has_buttons
      # Actually only for the coap example
      #
      # FIXME: Only the tx example sets this up, for the others, this has the
      # ugly side-effect of starving slipmux (at some point, we'll have to split the examples)
      - coap-server
      # Can't do OSCORE yet because we don't have the RNG; that is WIP in Ariel OS
      - coap-server-config-unprotected
