imports:
  - git:
      url: https://github.com/chrysn-pull-requests/ariel-os
      # branch "for-hophop-20260926", which merges https://github.com/ariel-os/ariel-os/pull/2101 and https://github.com/ariel-os/ariel-os/pull/1804 and https://github.com/ariel-os/ariel-os/pull/2333 -- and an extra of setting the STATE's embassy_net_driver_channel::State TX and RX count to 10
      commit: 0b7d3ca2ed4f584fdbb6c449fe71109142c35499
    dldir: ariel-os

apps:
  - name: hophop-examples
    selects:
      - nrf91-modem
      - nrf-radiocore-firmware-dect
      # Actually only for the tx example
      - has_buttons
    tasks:
      # like Ariel's default `run`, but without the --bin so you can add it manually.
      run:
        build: false
        workdir: ${appdir}
        cmd:
          - ${CARGO_PRESHELL} ${CARGO_ENV} ${CARGO} ${CARGO_TOOLCHAIN} ${CARGO_ARGS} run --profile=${PROFILE} ${FEATURES} $@
