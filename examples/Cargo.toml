[package]
name = "hophop-examples"
version = "0.0.0"
edition = "2024"

[dependencies]
hophop.path = "../hophop"

# external-interrupts only for TX's gpio input builder
ariel-os = { path = "build/imports/ariel-os/src/ariel-os", features = ["time", "external-interrupts"] }
ariel-os-boards = { path = "build/imports/ariel-os/src/ariel-os-boards" }
heapless = { version = "0.9.2", features = ["embedded-io-v0.7"] }

ts-103-636-numbers = { path = "../ts-103-636-numbers/", features = ["defmt"] }
ts-103-636-utils = { path = "../ts-103-636-utils/", features = ["defmt"] }

# while we're doing things hophop should do
nrf-modem = "*"
# hophop might even want to make this a feature, but in the next iteration it'll likely just be always-on
nrfxlib-sys = { version = "*", features = ["dect-mac"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-futures = { version = "0.1.2", features = ["defmt"] }

# we have to do this in build/imports/ariel-os/ariel-os-cargo.toml -- you'll
# find that when you notice that your nrfxlib-sys crate doesn't have a dect-mac
# feature.
[patch.crates-io]
# from https://github.com/nrf-rs/nrfxlib-sys/pull/20
nrfxlib-sys = { git = "https://github.com/chrysn-pull-requests/nrfxlib-sys", branch="nrfxlib330" }
