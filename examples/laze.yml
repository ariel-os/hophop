apps:
  - name: hophop-examples
    selects:
      - nrf91-modem
      - nrf-radiocore-firmware-dect
      # Actually only for the tx example
      - has_buttons
    tasks:
      # like Ariel's default `run`, but without the --bin so you can add it manually.
      run:
        build: false
        workdir: ${appdir}
        cmd:
          - ${CARGO_PRESHELL} ${CARGO_ENV} ${CARGO} ${CARGO_TOOLCHAIN} ${CARGO_ARGS} run --profile=${PROFILE} ${FEATURES} $@
