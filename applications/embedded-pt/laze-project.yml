imports:
  - git:
      url: https://github.com/chrysn-pull-requests/ariel-os
      # branch "for-hophop-20261027", which merges https://github.com/ariel-os/ariel-os/pull/2101 and https://github.com/ariel-os/ariel-os/pull/1613 and an extra of setting the STATE's embassy_net_driver_channel::State TX and RX count to 10
      commit: 234d19b4f859e4eacb5af14bedd6f150448ad9d4
    dldir: ariel-os

apps:
  - name: hophop-application-embedded-pt
    selects:
      - nrf91-modem
      - nrf-radiocore-firmware-dect
      # Actually only for the nrfmacdemo
      - ipv6 # has to be before network
      - network
      - user-net-driver-channel
      - coap-server
      - ?coap-server-config-storage
    conflicts:
      - ipv4
