imports:
  - git:
      url: https://github.com/chrysn-pull-requests/ariel-os
      # branch "for-hophop-20261007", which merges https://github.com/ariel-os/ariel-os/pull/2101 and https://github.com/ariel-os/ariel-os/pull/2333 -- and an extra of setting the STATE's embassy_net_driver_channel::State TX and RX count to 10
      commit: c349905bfd13e040cc2d658e4eeb09651977f815
    dldir: ariel-os

apps:
  - name: hophop-application-bridge-pt
    depends:
      - has_host_facing_uart
    selects:
      - nrf91-modem
      - nrf-radiocore-firmware-dect
      # CoAP via slipmux would be nice, but for the moment we make do with
      # 1. no CoAP, and maybe in a next step
      # 2. CoAP done manually in the slipmux server (bypassing ariel-os-coap and thus coapcore), or
      # 3. CoAP through a user-provided handler consumer (using ariel-os-coap)
      # with 3 possibly by copying stuff over from the slipmux PR (but that PR itself can't easily be made to also relay out IP packets pending xarxa)
      # (and then explore parallel-backend CoAP servers)
#       - coap-server
#       - coap-transport-slipmux
#       - ?coap-server-config-storage
